spring:
  application:
    name: flowdesk-backend

  datasource:
    url: jdbc:postgresql://localhost:5436/flowdesk_db
    username: flowdesk
    password: flowdesk123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
      host: smtp.gmail.com
      port: 587
      username: ${MAIL_USERNAME}
      password: ${MAIL_PASSWORD}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000