services:
    postgres:
      image: postgres:17
      container_name: flowdesk-postgres
      restart: unless-stopped
      environment:
        POSTGRES_DB: flowdesk_db
        POSTGRES_USER: flowdesk
        POSTGRES_PASSWORD: flowdesk123
      ports:
        - "5436:5432"
      volumes:
        - flowdesk_data:/var/lib/postgresql/data
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U flowdesk -d flowdesk_db" ]
        interval: 5s
        timeout: 5s
        retries: 5

volumes:
    flowdesk_data:
